[package]
name = "findmatch-gui"
version = "0.1.0"
edition = "2024"
publish = false

[dependencies]
anyhow = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
gpui = "=0.2.2"

[dev-dependencies]
tempfile = "3"
gpui = { version = "=0.2.2", features = ["test-support"] }

[patch.crates-io]
xattr = { path = "vendor/xattr" }

[profile.dev]
debug = 0

[profile.test]
debug = 0
